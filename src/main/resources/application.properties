spring.application.name=smtp-service
# Puerto del servidor
server.port=8082

# ================= SMTP Config =================
# Configure the SMTP provider credentials and host.
# Common providers:
#  - Gmail:   host=smtp.gmail.com, port=587, starttls=true, auth=true (requires App Password)
#  - Outlook: host=smtp.office365.com, port=587, starttls=true, auth=true
#  - Yahoo:   host=smtp.mail.yahoo.com, port=587, starttls=true, auth=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=romeromailercarlos@gmail.com
spring.mail.password=calccpheylhharyd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Evita probar la conexión SMTP al inicio
spring.mail.test-connection=false

# Remitente por defecto (alineado con la cuenta autenticada)
app.mail.from=romeromailercarlos@gmail.com

# Timeouts razonables
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# If you use SSL (implicit) instead of STARTTLS, uncomment:
# spring.mail.port=465
# spring.mail.properties.mail.smtp.starttls.enable=false
# spring.mail.properties.mail.smtp.ssl.enable=true

# ================= Logging =================
# Root level
logging.level.root=INFO
# Our package
logging.level.com.infinitosoft.smtpservice=INFO
# Useful Spring components
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.web=INFO

# ================= Actuator / Health =================
# Expone el endpoint de health básico en /actuator/health
management.endpoints.web.exposure.include=health
# No mostrar detalles del estado (básico)
management.endpoint.health.show-details=never
# Desactivar el indicador de salud para el correo
management.health.mail.enabled=false
