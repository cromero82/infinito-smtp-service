spring.application.name=smtp-service
server.port=8082

# ================= SMTP Config (LOCAL PROFILE) =================
# Perfil local con credenciales específicas provistas por el usuario.
# ADVERTENCIA: Este archivo contiene credenciales sensibles SOLO para pruebas locales.
# Elimínalo o bórrales el valor antes de commitear a un repositorio remoto.

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=romeromailercarlos@gmail.com
spring.mail.password=calccpheylhharyd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Evita probar la conexión SMTP al inicio
spring.mail.test-connection=false

# Remitente por defecto (alineado con la cuenta autenticada)
app.mail.from=romeromailercarlos@gmail.com

# Timeouts razonables
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ================= Logging =================
logging.level.root=INFO
logging.level.com.infinitosoft.smtpservice=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.web=INFO

# ================= Actuator / Health =================
management.health.mail.enabled=false

