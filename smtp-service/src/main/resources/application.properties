spring.application.name=smtp-service
# Puerto del servidor
server.port=8082

# ================= SMTP Config =================
# Configure the SMTP provider credentials and host.
# Common providers:
#  - Gmail:   host=smtp.gmail.com, port=587, starttls=true, auth=true (requires App Password)
#  - Outlook: host=smtp.office365.com, port=587, starttls=true, auth=true
#  - Yahoo:   host=smtp.mail.yahoo.com, port=587, starttls=true, auth=true

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your_username}
# IMPORTANTE: No colocar contraseñas reales en el repositorio. Usa variable de entorno
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONN_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:10000}

# If you use SSL (implicit) instead of STARTTLS, uncomment:
# spring.mail.port=465
# spring.mail.properties.mail.smtp.starttls.enable=false
# spring.mail.properties.mail.smtp.ssl.enable=true

# ================= Logging =================
# Root level
logging.level.root=INFO
# Our package
logging.level.com.infinitosoft.smtpservice=INFO
# Useful Spring components
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.web=INFO
